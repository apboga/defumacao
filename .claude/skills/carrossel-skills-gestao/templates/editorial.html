<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
/* =========================================================
   TEMA EDITORIAL — para público executivo / mentoria / liderança.
   Mesma estrutura do carrossel.html (capa + slides + rodapé),
   linguagem de revista de negócios / caderno de sessão.
   ========================================================= */
:root{
  --paper:#F3EEE6;      /* papel quente */
  --paper-2:#EAE3D8;    /* cartões / áreas de apoio */
  --ink:#1D1A17;        /* títulos */
  --body:#5A534D;       /* texto corrido */
  --muted:#8C847C;
  --rule:#D6CDC1;       /* fios */
  --accent:#2E5E5B;     /* verde-petróleo: calma, estratégia, maturidade */
  --accent-soft:#CFE0D9;/* marca-texto */
  --accent-light:#9CC7BD;/* acento sobre foto escura */
  --alert:#B5523B;      /* terracota: só para o "errado" / riscado */
  --w:1080px;--h:1350px;--pad:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.slide{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--paper);margin:0 auto 40px}
.serif{font-family:Fraunces,serif}
mark{background:linear-gradient(transparent 58%,var(--accent-soft) 58%, var(--accent-soft) 92%,transparent 92%);color:inherit;padding:0 .08em}

/* ---------- TOPO dos slides internos ---------- */
.topo{position:absolute;left:var(--pad);right:var(--pad);top:72px;display:flex;justify-content:space-between;align-items:center;
  font:600 17px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.topo .k{display:flex;align-items:center;gap:16px}
.topo .k::before{content:"";width:44px;height:2px;background:var(--accent)}
.topo .n{color:var(--muted);letter-spacing:.12em;font-weight:500}

/* ---------- CONTEÚDO ---------- */
.conteudo{position:absolute;left:var(--pad);right:var(--pad);top:120px;bottom:180px;display:flex;flex-direction:column;justify-content:center}
.numero{font:300 170px/0.8 Fraunces;font-variation-settings:"opsz" 96;color:var(--accent);margin-bottom:26px;letter-spacing:-.04em}
.titulo{font:460 66px/1.08 Fraunces;font-variation-settings:"opsz" 60,"SOFT" 30;letter-spacing:-.012em;color:var(--ink);max-width:var(--tw,870px)}
.titulo em{font-style:italic;font-weight:400;color:var(--accent)}
.texto{margin-top:38px;max-width:var(--bw,820px)}
.texto p{font:400 30px/1.42 Inter;color:var(--body)}
.texto p+p{margin-top:22px}
.texto b{color:var(--ink);font-weight:600}
.visual{margin-top:54px}

/* ---------- RODAPÉ ---------- */
.footer{position:absolute;left:var(--pad);right:var(--pad);bottom:0;height:150px;border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:20px}
.footer .avatar{width:74px;height:74px;border-radius:50%;object-fit:cover}
.footer .name{font:500 26px/1 Fraunces;color:var(--ink);letter-spacing:-.01em}
.footer .sub{font:500 15px/1 Inter;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:10px}
.footer .logo{margin-left:auto;height:52px}

/* ---------- CAPA ---------- */
.capa{background:#0d0d0d}
.capa .foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capa .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 42%,rgba(8,10,10,.78) 66%,rgba(8,10,10,.94) 100%)}
.capa .marca{position:absolute;left:var(--pad);top:80px;color:#fff;font:600 16px/1.3 Inter;letter-spacing:.2em;text-transform:uppercase}
.capa .marca span{display:block;color:rgba(255,255,255,.65);font-weight:500;margin-top:6px}
.capa .logo{position:absolute;right:var(--pad);top:70px;height:62px}
.capa .bloco{position:absolute;left:var(--pad);right:var(--pad);bottom:110px}
.capa .kicker{display:inline-flex;align-items:center;gap:14px;color:var(--accent-light);font:600 18px/1 Inter;letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px}
.capa .kicker::before{content:"";width:44px;height:2px;background:var(--accent-light)}
.capa h1{font:420 96px/1.02 Fraunces;font-variation-settings:"opsz" 72,"SOFT" 30;letter-spacing:-.015em;color:#fff}
.capa h1 em{font-style:italic;color:var(--accent-light)}
.capa h1 u{text-decoration:none;background:linear-gradient(transparent 82%,var(--accent-light) 82%,var(--accent-light) 90%,transparent 90%)}
.capa .swipe{margin-top:36px;color:rgba(255,255,255,.7);font:500 18px/1 Inter;letter-spacing:.12em;text-transform:uppercase}

/* =========================================================
   COMPONENTES VISUAIS (substituem as mini-UIs de tecnologia)
   ========================================================= */
/* Página de caderno */
.caderno{background:#FBF8F3;border-radius:4px;box-shadow:0 1px 0 var(--rule),0 18px 40px -24px rgba(60,40,20,.35);padding:30px 38px 32px;position:relative}
.caderno::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);border-radius:4px 0 0 4px}
.caderno .cab{font:600 17px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.check{display:flex;align-items:center;gap:18px;font:400 28px/1.25 Inter;color:var(--ink);padding:11px 0;border-bottom:1px dashed var(--rule)}
.check i{width:28px;height:28px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;flex:none;color:var(--accent);font:700 15px/1 Inter;font-style:normal}
.desfecho{margin-top:22px;font:italic 400 36px/1.2 Fraunces;color:var(--ink)}
.desfecho s{color:var(--alert);text-decoration-thickness:2px}
.desfecho b{color:var(--alert);font-weight:500}

/* Riscado (frase errada) */
.riscado{font:italic 400 34px/1.3 Fraunces;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--alert);text-decoration-thickness:2.5px}
.rotulo{font:600 16px/1 Inter;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}
.rotulo.x{color:var(--alert)} .rotulo.ok{color:var(--accent)}
.citacao{font:italic 400 38px/1.28 Fraunces;color:var(--ink);border-left:4px solid var(--accent);padding-left:26px}

/* Lista numerada em duas colunas */
.perguntas{display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;margin-top:26px}
.perguntas div{display:flex;gap:14px;font:400 25px/1.3 Inter;color:var(--ink)}
.perguntas b{font:500 25px/1.3 Fraunces;color:var(--accent);flex:none}

/* Três colunas tipo framework */
.tri{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.tri>div{padding:22px 22px 0 0}
.tri>div+div{padding-left:22px;border-left:1px solid var(--rule)}
.tri .letra{font:300 96px/1 Fraunces;color:var(--accent)}
.tri h4{font:600 18px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:12px 0 10px}
.tri p{font:400 25px/1.35 Inter;color:var(--body)}

/* Comparação grande */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1.5px solid var(--ink)}
.duo>div{padding:26px 30px 0 0}
.duo>div+div{padding-left:30px;border-left:1px solid var(--rule)}
.duo h4{font:600 17px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.duo .frase{font:400 60px/1.05 Fraunces;color:var(--ink);letter-spacing:-.015em}
.duo .frase em{color:var(--accent)}
.duo ul{list-style:none;margin-top:18px}
.duo li{font:400 25px/1.35 Inter;color:var(--body);padding:7px 0 7px 22px;position:relative}
.duo li::before{content:"—";position:absolute;left:0;color:var(--accent)}

/* Diagrama de três círculos */
.venn{display:flex;justify-content:center}
.venn svg{width:820px;height:auto}

/* Fechamento e CTA */
.fechamento .titulo{font-size:66px}
.cta .conteudo{justify-content:center}
.cta .titulo{font-size:72px;line-height:1.06}
.cta .apoio{margin-top:40px;font:500 18px/1 Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:16px}
.cta .apoio::before{content:"";width:44px;height:2px;background:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc=s=>String(s??'');
function footer(a){return `<div class="footer">${a.avatar?`<img class="avatar" src="${a.avatar}">`:''}
  <div><div class="name">${esc(a.nome)}</div><div class="sub">${esc(a.subtitulo)}</div></div>
  ${a.logo?`<img class="logo" src="${a.logo}">`:''}</div>`}
function capa(s,a){return `<section class="slide capa">
  ${s.foto?`<img class="foto" src="${s.foto}" style="object-position:${s.foco||'center'}">`:''}<div class="shade"></div>
  <div class="marca">${esc(a.nome)}<span>${esc(a.subtitulo)}</span></div>
  ${a.logo_claro?`<img class="logo" src="${a.logo_claro}">`:''}
  <div class="bloco">${s.kicker?`<div class="kicker">${s.kicker}</div>`:''}<h1>${s.titulo}</h1>
  ${s.swipe!==false?`<div class="swipe">${s.swipe||'Deslize →'}</div>`:''}</div></section>`}
function topico(s,a,i,n){return `<section class="slide ${s.tipo}">
  <div class="topo"><span class="k">${esc(s.kicker||'')}</span><span class="n">${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span></div>
  <div class="conteudo" style="${s.tw?`--tw:${s.tw}px;`:''}${s.bw?`--bw:${s.bw}px;`:''}">
    ${s.numero?`<div class="numero">${s.numero}</div>`:''}
    <h2 class="titulo">${s.titulo}</h2>
    ${s.paragrafos?.length?`<div class="texto">${s.paragrafos.map(p=>`<p>${p}</p>`).join('')}</div>`:''}
    ${s.apoio?`<div class="apoio">${s.apoio}</div>`:''}
    ${s.visual_img?`<div class="visual"><img src="${s.visual_img}" style="max-width:100%"></div>`:s.visual_html?`<div class="visual">${s.visual_html}</div>`:''}
  </div>${footer(a)}</section>`}
function render(c){const a=c.autor,n=c.slides.length;
  if(c.cores)for(const[k,v]of Object.entries(c.cores))document.documentElement.style.setProperty('--'+k,v);
  document.getElementById('root').innerHTML=c.slides.map((s,i)=>s.tipo==='capa'?capa(s,a):topico(s,a,i,n)).join('')}
(async()=>{if(window.CONTEUDO)return render(window.CONTEUDO);
  const q=new URLSearchParams(location.search).get('json');if(q)render(await(await fetch(q)).json())})();
</script>
</body>
</html>
